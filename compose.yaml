name: open-agents

services:
  traefik:
    image: traefik:v3.4
    environment:
      DOCKER_API_VERSION: "1.54"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --ping=true
      - --log.level=INFO
    ports:
      - "${OPEN_AGENTS_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - platform
    restart: unless-stopped

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_agents}
      POSTGRES_USER: ${POSTGRES_USER:-open_agents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-open_agents} -d ${POSTGRES_DB:-open_agents}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - platform
    restart: unless-stopped

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    networks:
      - platform
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    env_file:
      - ${OPEN_AGENTS_ENV_FILE:-./docker/platform.env}
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-open_agents}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-open_agents}
      REDIS_URL: redis://redis:6379
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-docker-container}
      NEXT_PUBLIC_SANDBOX_BACKEND: ${NEXT_PUBLIC_SANDBOX_BACKEND:-docker-container}
      DOCKER_SOCKET_PATH: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-open-agents-sandbox:local}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-open-agents}
      SANDBOX_DOMAIN_SUFFIX: ${SANDBOX_DOMAIN_SUFFIX:-127.0.0.1.sslip.io}
      SANDBOX_WORKSPACE_ROOT: ${SANDBOX_WORKSPACE_ROOT:-/var/lib/open-agents/workspaces}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_WORKSPACE_ROOT:-/var/lib/open-agents/workspaces}:${SANDBOX_WORKSPACE_ROOT:-/var/lib/open-agents/workspaces}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${SANDBOX_NETWORK:-open-agents}
      traefik.http.routers.open-agents.rule: Host(`${OPEN_AGENTS_APP_HOST:-openagents.local}`)
      traefik.http.routers.open-agents.entrypoints: web
      traefik.http.services.open-agents.loadbalancer.server.port: "3000"
    networks:
      - platform
    restart: unless-stopped

networks:
  platform:
    name: ${SANDBOX_NETWORK:-open-agents}

volumes:
  postgres-data:
  redis-data:
